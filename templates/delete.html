<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get-it - Apagar anotação</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
      integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/getit.css" />
  </head>

  <body>
    <div class="appbar">
      <img src="/img/logo-getit.png" class="logo" alt="Logo Get-it" />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
    </div>

    <main class="container">
      <form class="form-card" method="POST" action="/delete/{id}">
        <p class="confirm-question">Você realmente deseja apagar esta anotação?</p>

        <div class="confirm-note">
          <div class="card">
            <h3 class="card-title">{title}</h3>
            <div class="card-content">
              <p>{content}</p>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a class="btn btn-secondary" href="/">Não</a>
          <button class="btn" type="submit">Sim</button>
        </div>
      </form>
    </main>

    <script type="text/javascript" src="/getit.js"></script>
  </body>
</html>
